name: Self-Heal Tests (Master Merge)

on:
  push:
    branches:
     - master

jobs:
  Master-Merge:
    runs-on: ubuntu-latest
    env:
      LOCATOR_BASE_PATH: ${{ vars.LOCATOR_BASE_PATH }}
      LOGGER_BASE_PATH: ${{ vars.LOGGER_BASE_PATH }}
      USERNAME: ${{ vars.USERNAME }}
      PASSWORD: ${{ vars.PASSWORD }}
      URL: ${{ vars.URL }}

    steps:
      - name: Initial checkout
        uses: actions/checkout@v4

      - name: Python Set-up
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
        
      - name: Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Prepare artifact directories
        run: |
          mkdir -p logs 
          mkdir -p reports

      - name: Running The Unit Test Cases
        run: |
          PYTHONPATH=$PWD pytest -vv -m unit tests/

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-run-artifacts
          path: |
            logs/
            reports/