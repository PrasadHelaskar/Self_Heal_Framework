name: Self-Heal Evening Running

on:
  schedule:
    - cron: "30 12 * * *"
  
  workflow_dispatch:

jobs:
  self-heal-evening:
    name: Evening Self-Heal Stability Run
    runs-on: ubuntu-latest
    env:
      LOCATOR_BASE_PATH: ${{ secrets.LOCATOR_BASE_PATH }}
      LOGGER_BASE_PATH: ${{ secrets.LOGGER_BASE_PATH }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      URL: ${{ secrets.URL }}

    steps:
      - name: Initial checkout
        uses: actions/checkout@v4

      - name: Python Set-up
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
        
      - name: Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare artifact directories
        run: |
          mkdir -p logs 
          mkdir -p reports
      
      - name: Running The Regession Test Cases
        run: |
          PYTHONPATH=$PWD pytest -vv -m flows tests/

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-heal-artifacts
          path: |
            logs/
            reports/

