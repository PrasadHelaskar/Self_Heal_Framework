[pytest]
addopts = 
    --html=reports/report.html
    --self-contained-html

filterwarnings =
    ignore:.*pyOpenSSL.*:DeprecationWarning
    ignore:.*X509Extension support in pyOpenSSL is deprecated.*:DeprecationWarning
    ignore:.*cryptography.*X.509.*:DeprecationWarning

markers =
    unit: unit tests 
    flows: testing the flows